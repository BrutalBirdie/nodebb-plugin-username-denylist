name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        # Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
        # Requires a Trusted Publisher to be configured for this package on npmjs.com.
        run: npm publish --provenance --access public
